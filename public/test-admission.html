<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bright Angels Admissions Test</title>
</head>
<body style="font-family:Arial,sans-serif;max-width:600px;margin:30px auto;padding:16px">
  <h2>Bright Angels Admissions Test</h2>
  <p>This sends one test application using fake details.</p>
  <button id="testButton" type="button" style="padding:12px;background:#173b91;color:white;border:0">
    Run Test
  </button>
  <pre id="result" style="white-space:pre-wrap;overflow-wrap:anywhere;background:#eee;padding:12px">Ready to test.</pre>  <script>
    document.getElementById("testButton").addEventListener("click", async function () {
      const button = this;
      const result = document.getElementById("result");
      button.disabled = true;
      result.textContent = "Sending test application...";

      try {
        const response = await fetch("/api/admissions", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            child_name: "Diagnostic Test Child",
            class_applying: "Primary 1",
            date_of_birth: "2020-01-01",
            gender: "Not specified",
            previous_school: "Test only",
            guardian_name: "Diagnostic Test Guardian",
            relationship: "Parent",
            phone: "0000000000",
            email: "",
            district: "Test",
            address: "Test application",
            medical_notes: ""
          })
        });

        const body = await response.text();
        result.textContent = "HTTP status: " + response.status +
          "\n\nServer response:\n" + body;
      } catch (error) {
        result.textContent = "Request failed: " + error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script></body>
</html>
